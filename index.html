<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifty States Drill</title>
<meta name="description" content="Learn all 50 US states on a real map: study modes for location and letter groups, plus quizzes on shapes, capitals, postal codes and borders.">
<!-- The card iMessage, Slack, X and the like draw under a link. The image and
     canonical address are absolute on purpose: previews are fetched by their
     servers, not the browser, and a Versus invite is this page plus a hash,
     so every link to the app shows the same card. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fifty States Drill">
<meta property="og:title" content="Fifty States Drill">
<meta property="og:description" content="Learn all 50 US states on a real map, then race a friend in Versus: same questions, one clock.">
<meta property="og:url" content="https://fifty-states-drill.vercel.app/">
<meta property="og:image" content="https://fifty-states-drill.vercel.app/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fifty States Drill: a map of the mainland United States with Missouri highlighted.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fifty States Drill">
<meta name="twitter:description" content="Learn all 50 US states on a real map, then race a friend in Versus: same questions, one clock.">
<meta name="twitter:image" content="https://fifty-states-drill.vercel.app/og.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E7EAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="50 States">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div id="root"></div>
<script>
/* Applied before first paint so a saved override does not flash the other
   theme on load. Mirrors THEME_KEY in src/hooks/useTheme.ts. */
try {
  var t = localStorage.getItem('fiftyStatesDrill.theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) { /* blocked storage: follow the system */ }
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
