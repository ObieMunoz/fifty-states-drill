name: Redirect the old address

# The app itself deploys from Vercel on every push to main. The GitHub Pages
# address it used to live at now serves only the redirect in redirect/, which
# carries each device's saved progress across and retires the old service
# worker. Keep publishing it: installed apps and bookmarks still point here.
on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v5
